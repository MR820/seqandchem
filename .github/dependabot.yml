version: 2
updates:
  # Review dependency bumps one at a time. Direct pins stay in the .in files;
  # the hashed requirements*.txt locks are pip-compile output.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 2
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:20"
      timezone: Etc/UTC
    open-pull-requests-limit: 1
    labels:
      - dependencies
