name: External uptime

# Secondary probe from a GitHub-hosted runner. The primary checks are the
# Cloudflare Worker seqchem-uptime (cron */5) and deploy/uptime-check.sh (cron */5).
# GitHub delays or drops schedule events under load, especially at the start of
# an hour, and does not backfill missed ticks. These crons avoid minute 0 and
# request 12 runs/day. That is best-effort coverage, not a minute-level SLA.

on:
  schedule:
    - cron: "17 */3 * * *"
    - cron: "47 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: external-uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check public site and API
        run: |
          set -euo pipefail
          python3 deploy/external_uptime.py check \
            --site https://seqandchem.com/ \
            --site-health https://seqandchem.com/health \
            --api-health https://api.seqandchem.com/health \
            --convert https://api.seqandchem.com/api/v1/convert

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_WEBHOOK_SECRET: ${{ secrets.FEISHU_WEBHOOK_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 deploy/external_uptime.py notify \
            --text "$(printf '%s\n' \
              "SeqChem secondary GitHub Actions uptime check failed." \
              "Primary checks remain Cloudflare Worker seqchem-uptime and the on-host cron." \
              "$RUN_URL")"

      - name: Record best-effort context
        if: always()
        run: |
          {
            echo "### Secondary external uptime check"
            echo
            echo "Best-effort GitHub Actions probe. Not a minute-level SLA."
            echo
            echo "- Event: \`${{ github.event_name }}\`"
            echo "- Schedule expression: \`${{ github.event.schedule }}\`"
            echo "- Observed start (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Primary external check: Cloudflare Worker \`seqchem-uptime\` cron \`*/5\`"
            echo "- On-host check: \`uptime-check.sh\` cron \`*/5\`"
          } >> "$GITHUB_STEP_SUMMARY"
