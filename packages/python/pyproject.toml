[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqchem"
version = "0.1.0"
description = "Python client for the SeqChem API — free chemistry and bioinformatics tools"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SeqChem", email = "devin2xing@gmail.com" }]
keywords = [
    "chemistry", "cheminformatics", "smiles", "inchi", "inchikey", "sdf", "mol",
    "openbabel", "bioinformatics", "fasta", "fastq", "molecular-descriptors",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://seqandchem.com"
Documentation = "https://seqandchem.com/api"
Source = "https://github.com/MR820/seqandchem"
Changelog = "https://github.com/MR820/seqandchem/releases"

[project.scripts]
seqchem = "seqchem.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seqchem = ["py.typed"]
