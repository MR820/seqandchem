user www-data;
worker_processes auto;
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    log_format seqchem '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'rt=$request_time urt=$upstream_response_time';
    # 真实客户端 IP 从 stream 层的 PROXY protocol 取回
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
stream {
    map $ssl_preread_server_name $sni_backend {
        cc-2.xn--30rs3bu7r87f.site 127.0.0.1:12100;
        seqandchem.com 127.0.0.1:8444;
        stats.seqandchem.com 127.0.0.1:8445;
        www.seqandchem.com 127.0.0.1:8444;
        default                         127.0.0.1:8443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $sni_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
    # xboard-node 不识别 PROXY protocol：在此接收并丢弃头部，再按普通 TCP 转发
    server {
        listen 127.0.0.1:12100 proxy_protocol;
        proxy_pass 127.0.0.1:12005;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
