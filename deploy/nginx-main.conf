user www-data;
worker_processes auto;
worker_rlimit_nofile 16384;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;
events { worker_connections 4096; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    log_format seqchem '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                       'rt=$request_time urt=$upstream_response_time';
    # 真实客户端 IP：直连走 stream 层 PROXY protocol，Cloudflare 走 CF-Connecting-IP
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    # Cloudflare IP ranges — https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
stream {
    map $ssl_preread_server_name $sni_backend {
        cc-2.xn--30rs3bu7r87f.site 127.0.0.1:12100;
        seqandchem.com 127.0.0.1:8444;
        stats.seqandchem.com 127.0.0.1:8445;
        www.seqandchem.com 127.0.0.1:8444;
        default                         127.0.0.1:8443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $sni_backend;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
    # xboard-node 不识别 PROXY protocol：在此接收并丢弃头部，再按普通 TCP 转发
    server {
        listen 127.0.0.1:12100 proxy_protocol;
        proxy_pass 127.0.0.1:12005;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
