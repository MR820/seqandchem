name: External uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public site and API
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://seqandchem.com/ >/dev/null
          curl -fsS --max-time 20 https://seqandchem.com/health \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("formats", 0) > 0'
          curl -fsS --max-time 20 https://api.seqandchem.com/health \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") and d.get("formats", 0) > 0'
          code=$(curl -sS --max-time 30 -o /tmp/convert.json -w '%{http_code}' \
            -X POST https://api.seqandchem.com/api/v1/convert \
            -H 'Content-Type: application/json' \
            -d '{"from":"smi","to":"inchi","data":"CCO"}')
          test "$code" = "200"
          python3 -c 'import json; d=json.load(open("/tmp/convert.json")); assert d.get("ok")'

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${FEISHU_WEBHOOK:-}" ]; then
            echo "FEISHU_WEBHOOK is not configured; relying on GitHub Actions failure notifications."
            exit 0
          fi
          python3 - <<'PY'
          import json, os, urllib.request
          url = os.environ["FEISHU_WEBHOOK"]
          text = "SeqChem external uptime check failed.\n" + os.environ["RUN_URL"]
          body = json.dumps({"msg_type": "text", "content": {"text": text}}).encode()
          req = urllib.request.Request(url, data=body, headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=20).read()
          PY
