server {
    listen 80;
    listen [::]:80;
    server_name seqandchem.com www.seqandchem.com;
    access_log /var/log/nginx/seqchem.access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://seqandchem.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.seqandchem.com;
    access_log /var/log/nginx/api.seqchem.access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://api.seqandchem.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    listen [::1]:8444 ssl http2 proxy_protocol;

    server_name seqandchem.com;
    access_log /var/log/nginx/seqchem.access.log seqchem;

    ssl_certificate     /etc/letsencrypt/live/seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # 拦截常见漏洞扫描（伪装 Googlebot 扫 .env/.git/wp-config 之类）
    location ~* /(?:\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.docker|\.DS_Store|secrets?\.json|\.dev\.vars|\.htaccess|\.htpasswd|wp-config\.php|wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|adminer|config\.php) {
        access_log off;
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    listen [::1]:8444 ssl http2 proxy_protocol;
    server_name www.seqandchem.com;

    ssl_certificate     /etc/letsencrypt/live/seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://seqandchem.com$request_uri;
}

# DNS-only subdomain for long-running API jobs. Cloudflare's free plan caps
# proxied origin responses at 100s; /api/v1/batch can run longer.
server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    listen [::1]:8444 ssl http2 proxy_protocol;
    server_name api.seqandchem.com;
    access_log /var/log/nginx/api.seqchem.access.log seqchem;

    ssl_certificate     /etc/letsencrypt/live/api.seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 64m;

    # This vhost is DNS-only (no Cloudflare), so take the real client address
    # from the stream layer's PROXY protocol instead of CF-Connecting-IP.
    real_ip_header proxy_protocol;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;

    location = / {
        return 302 https://seqandchem.com/api;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
