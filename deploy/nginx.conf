server {
    listen 80;
    listen [::]:80;
    server_name seqandchem.com www.seqandchem.com;
    access_log /var/log/nginx/seqchem.access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://seqandchem.com$request_uri;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.seqandchem.com;
    access_log /var/log/nginx/api.seqchem.access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://api.seqandchem.com$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    listen [::1]:8444 ssl http2 proxy_protocol;

    server_name seqandchem.com;
    access_log /var/log/nginx/seqchem.access.log seqchem;

    ssl_certificate     /etc/letsencrypt/live/seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 8m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Enforced CSP (same policy previously verified as Report-Only). No report-uri/
    # report-to collection endpoint. Policy content is unchanged.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.seqandchem.com https://pubchem.ncbi.nlm.nih.gov https://cloudflareinsights.com; frame-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors https: http: 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"ok":false,"error":"Request body too large"}';
    }
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"error":"Rate limit exceeded"}';
    }

    # 拦截常见漏洞扫描（伪装 Googlebot 扫 .env/.git/wp-config 之类）
    location ~* /(?:\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.docker|\.DS_Store|secrets?\.json|\.dev\.vars|\.htaccess|\.htpasswd|wp-config\.php|wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|adminer|config\.php) {
        access_log off;
        return 403;
    }

    location = /api/feedback {
        client_max_body_size 16k;
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/batch {
        client_max_body_size 64m;
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /api/v1/batch {
        client_max_body_size 64m;
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # The prefix /api/ would make nginx redirect /api to /api/ (including the
    # internal :8444 port), so serve the HTML API docs explicitly.
    location = /api {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ^~ /api/ {
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }


    # Narrow exception: embed widget has a classic inline script (template variables,
    # no stable hash). Repeat all server security headers because nginx add_header
    # in a location does not inherit parent add_header. Do not use this for /embed docs.
    # Enforced policy matches the verified Report-Only string for this path.
    location ^~ /embed/convert {
        # Hide the app's frame-ancestors-only CSP so the browser sees one enforced
        # policy. The nginx header already contains the same frame-ancestors value.
        proxy_hide_header Content-Security-Policy;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com 'unsafe-eval' blob: 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.seqandchem.com https://pubchem.ncbi.nlm.nih.gov https://cloudflareinsights.com; frame-src 'self'; worker-src 'self' blob:; child-src 'self' blob:; frame-ancestors https: http: 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    listen [::1]:8444 ssl http2 proxy_protocol;
    server_name www.seqandchem.com;

    ssl_certificate     /etc/letsencrypt/live/seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Sent on the HTTPS 301 so first visit to https://www also gets HSTS (same as apex).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://seqandchem.com$request_uri;
}

# DNS-only subdomain for long-running API jobs. Cloudflare's free plan caps
# proxied origin responses at 100s; /api/v1/batch can run longer.
server {
    listen 127.0.0.1:8444 ssl http2 proxy_protocol;
    listen [::1]:8444 ssl http2 proxy_protocol;
    server_name api.seqandchem.com;
    access_log /var/log/nginx/api.seqchem.access.log seqchem;

    ssl_certificate     /etc/letsencrypt/live/api.seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 8m;

    # This vhost is DNS-only (no Cloudflare), so take the real client address
    # from the stream layer's PROXY protocol instead of CF-Connecting-IP.
    real_ip_header proxy_protocol;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex" always;

    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"ok":false,"error":"Request body too large"}';
    }
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"ok":false,"error":"Rate limit exceeded"}';
    }

    location = / {
        return 302 https://seqandchem.com/api;
    }

    location = /api/feedback {
        client_max_body_size 16k;
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/batch {
        client_max_body_size 64m;
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /api/v1/batch {
        client_max_body_size 64m;
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location ^~ /api/ {
        limit_req zone=seqchem_api_ip burst=20 nodelay;
        limit_req zone=seqchem_api_site burst=30 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
