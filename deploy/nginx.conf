server {
    listen 80;
    listen [::]:80;
    server_name seqandchem.com www.seqandchem.com;
    access_log /var/log/nginx/seqchem.access.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8444 ssl http2;
    listen [::1]:8444 ssl http2;

    server_name seqandchem.com www.seqandchem.com;
    access_log /var/log/nginx/seqchem.access.log;

    ssl_certificate     /etc/letsencrypt/live/seqandchem.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seqandchem.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    client_max_body_size 64m;


    # 拦截常见漏洞扫描（伪装 Googlebot 扫 .env/.git/wp-config 之类）
    location ~* /(?:\.env|\.git|\.svn|\.hg|\.aws|\.ssh|\.docker|\.DS_Store|secrets?\.json|\.dev\.vars|\.htaccess|\.htpasswd|wp-config\.php|wp-login\.php|wp-admin|xmlrpc\.php|phpmyadmin|adminer|config\.php) {
        access_log off;
        return 444;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
