{% extends "base.html" %}

{% block content %}
<article>
  <h2 class="page-title">{{ h1 }}</h2>
  <p class="lead">{{ lead }}</p>
  <div class="prose">{{ prose|safe }}</div>
</article>

<div class="card">
  <h3 style="margin:0 0 10px;font-size:15px">Related tools</h3>
  <div class="row" style="gap:8px">
    {% for href, label in related %}<a class="ghost-link" href="{{ href }}">{{ label }}</a>
    {% endfor %}
    <a class="ghost-link" href="/guides/">All guides</a>
  </div>
</div>

<div class="card" style="border-color:#e5e7eb">
  <p class="hint" style="margin:0">Published {{ published }} · SeqChem</p>
</div>
{% endblock %}
